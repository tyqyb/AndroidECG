plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

//apply plugin: 'com.chaquo.python'


android {
    namespace 'USTB.AAIST'
    compileSdk 34

    defaultConfig {
        applicationId "USTB.AAIST"
        minSdk 31//原21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            // 指定abi，如需在模拟器调试，增加"x86"，否则指定"armeabi-v7a"即可
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        python {
            pip {
                install "matplotlib"
                install "numpy"
                install "scipy"
//                install "math"
            }
        }

